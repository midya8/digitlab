[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digitlab"
version = "0.5.0"
description = "Real-data NumPy digit training and bounded-input attack audits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6"]
license = {text = "MIT for code; bundled UCI dataset CC BY 4.0"}

[tool.setuptools.packages.find]
include = ["digitlab*"]

[tool.setuptools.package-data]
digitlab = ["data/*", "artifacts/*.json"]
